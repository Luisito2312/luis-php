services:
    web:
        build: .
        container_name: oficina-web
        ports:
            - "80:80"
        volumes:
            - ./src:/var/www/html
        depends_on:
            - db

    db:
        image: mysql:lts
        container_name: oficina-db
        environment: 
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: oficina
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports: 
            - "3306:3306"